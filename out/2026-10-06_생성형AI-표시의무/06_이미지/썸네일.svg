<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <title>칼럼 썸네일 — ‘AI 생성’ 표시, 글 쓰는 사람의 의무인가</title>
  <rect width="1200" height="630" fill="#0f2440"/>
  <g transform="translate(860 120)">
    <path d="M0 40 L60 0 L240 0 L240 80 L60 80 Z" fill="none" stroke="#f2c14e" stroke-width="4"/>
    <circle cx="40" cy="40" r="9" fill="#f2c14e"/>
    <text x="150" y="52" font-size="30" font-weight="700" fill="#f2c14e" text-anchor="middle">AI 생성</text>
  </g>
  <text x="80" y="300" font-size="62" font-weight="700" fill="#ffffff">‘AI 생성’ 표시,</text>
  <text x="80" y="385" font-size="62" font-weight="700" fill="#ffffff">글 쓰는 사람의 의무인가</text>
  <rect x="80" y="430" width="120" height="6" fill="#f2c14e"/>
  <text x="80" y="492" font-size="28" fill="#c9d4e3">AI 기본법 · EU AI Act · 플랫폼 표기 · 출처</text>
</svg>
