<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" aria-label="성능이 아니라 사용 영역이 의무를 가르는 구조를 보여 주는 개념도">
  <rect x="0" y="0" width="820" height="440" fill="#ffffff"/>
  <text x="40" y="46" font-family="sans-serif" font-size="22" font-weight="bold" fill="#111111">법은 무엇을 묻는가 — 성능이 아니라 자리</text>

  <rect x="40" y="80" width="300" height="110" rx="8" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.5"/>
  <text x="60" y="110" font-family="sans-serif" font-size="15" fill="#777777">법이 묻지 않는 것</text>
  <text x="60" y="140" font-family="sans-serif" font-size="16" fill="#777777">벤치마크 점수</text>
  <text x="60" y="166" font-family="sans-serif" font-size="16" fill="#777777">자율 수행 작업 비율</text>
  <line x1="52" y1="152" x2="328" y2="106" stroke="#cccccc" stroke-width="2"/>

  <rect x="480" y="80" width="300" height="110" rx="8" fill="#e8eef6" stroke="#4a6fa5" stroke-width="2"/>
  <text x="500" y="110" font-family="sans-serif" font-size="15" fill="#4a6fa5">법이 먼저 묻는 것</text>
  <text x="500" y="140" font-family="sans-serif" font-size="16" fill="#111111">어느 영역에 쓰이는가</text>
  <text x="500" y="166" font-family="sans-serif" font-size="16" fill="#111111">누가 멈출 수 있는가</text>

  <rect x="40" y="230" width="350" height="150" rx="8" fill="#ffffff" stroke="#4a6fa5" stroke-width="2"/>
  <text x="60" y="258" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4a6fa5">한국 — 고영향 인공지능 [1]</text>
  <text x="60" y="286" font-family="sans-serif" font-size="14" fill="#111111">생명 · 신체의 안전 · 기본권에</text>
  <text x="60" y="306" font-family="sans-serif" font-size="14" fill="#111111">중대한 영향을 미치는 활용 영역</text>
  <text x="60" y="334" font-family="sans-serif" font-size="14" fill="#111111">열한 개 목으로 열거</text>
  <text x="60" y="358" font-family="sans-serif" font-size="13" fill="#666666">에너지 · 보건의료 · 채용 · 대출 심사 등</text>

  <rect x="430" y="230" width="350" height="150" rx="8" fill="#ffffff" stroke="#4a6fa5" stroke-width="2"/>
  <text x="450" y="258" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4a6fa5">유럽연합 — 고위험 [3]</text>
  <text x="450" y="286" font-family="sans-serif" font-size="14" fill="#111111">부속서가 정한 영역에 쓰이면</text>
  <text x="450" y="306" font-family="sans-serif" font-size="14" fill="#111111">고위험으로 분류</text>
  <text x="450" y="334" font-family="sans-serif" font-size="14" fill="#111111">그때부터 의무가 붙는다</text>
  <text x="450" y="358" font-family="sans-serif" font-size="13" fill="#666666">규정 (EU) 2024/1689</text>

  <line x1="630" y1="190" x2="630" y2="228" stroke="#4a6fa5" stroke-width="2"/>
  <line x1="215" y1="190" x2="215" y2="228" stroke="#4a6fa5" stroke-width="2"/>

  <text x="40" y="418" font-family="sans-serif" font-size="13" fill="#666666">출처: [1] [3]</text>
</svg>
