<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" role="img" aria-label="감독자에게 주어지는 권한과 그 권한이 실제로 쓰이지 못하게 하는 한계, 그리고 횡단 기능으로서의 거버넌스를 보여 주는 개념도">
  <rect x="0" y="0" width="820" height="500" fill="#ffffff"/>
  <text x="40" y="46" font-family="sans-serif" font-size="22" font-weight="bold" fill="#111111">권한을 주는 일과 그 권한이 쓰이게 하는 일</text>

  <rect x="40" y="76" width="340" height="200" rx="8" fill="#e8eef6" stroke="#4a6fa5" stroke-width="2"/>
  <text x="60" y="104" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4a6fa5">감독자에게 주어지는 권한 [3]</text>
  <text x="60" y="134" font-family="sans-serif" font-size="14" fill="#111111">· 그 시스템을 쓰지 않기로 결정</text>
  <text x="60" y="158" font-family="sans-serif" font-size="14" fill="#111111">· 출력을 무시 · 기각 · 되돌리기</text>
  <text x="60" y="182" font-family="sans-serif" font-size="14" fill="#111111">· 작동에 개입</text>
  <text x="60" y="206" font-family="sans-serif" font-size="14" fill="#111111">· 정지 버튼 또는 그에 준하는 절차로</text>
  <text x="72" y="228" font-family="sans-serif" font-size="14" fill="#111111">안전한 상태에서 멈추기</text>
  <text x="60" y="256" font-family="sans-serif" font-size="13" fill="#666666">감독 조치는 위험 · 자율성 수준 · 사용 맥락에 비례</text>

  <rect x="440" y="76" width="340" height="200" rx="8" fill="#f7efe8" stroke="#a5724a" stroke-width="2"/>
  <text x="460" y="104" font-family="sans-serif" font-size="15" font-weight="bold" fill="#a5724a">그래도 메워지지 않는 자리 [4] [5]</text>
  <text x="460" y="134" font-family="sans-serif" font-size="14" fill="#111111">· 자동화 안일 — 초보자와 전문가 모두,</text>
  <text x="472" y="156" font-family="sans-serif" font-size="14" fill="#111111">반복 연습으로 극복되지 않음</text>
  <text x="460" y="182" font-family="sans-serif" font-size="14" fill="#111111">· 자동화 편향 — 훈련이나 지시로</text>
  <text x="472" y="204" font-family="sans-serif" font-size="14" fill="#111111">예방되지 않고 팀 결정에도 영향</text>
  <text x="460" y="232" font-family="sans-serif" font-size="14" fill="#111111">· 사람의 감독 요구가 도입에</text>
  <text x="472" y="254" font-family="sans-serif" font-size="14" fill="#111111">"거짓된 안전감"을 준다는 지적</text>

  <line x1="382" y1="176" x2="436" y2="176" stroke="#999999" stroke-width="2"/>

  <rect x="40" y="320" width="740" height="110" rx="8" fill="#ffffff" stroke="#4a6fa5" stroke-width="2"/>
  <text x="60" y="350" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4a6fa5">그래서 권한은 구조에 적어 둔다 — 거버넌스는 횡단 기능 [6]</text>
  <text x="60" y="380" font-family="sans-serif" font-size="14" fill="#111111">거버넌스(GOVERN)는 다른 기능들을 가로질러 가능하게 한다 — 그 결과를 제자리에 둔 다음에야 매핑(MAP)으로 시작한다.</text>
  <text x="60" y="406" font-family="sans-serif" font-size="14" fill="#111111">사람과 인공지능의 구성 방식 · 시스템 감독에 관한 역할과 책임을 정의하고 구분하는 정책과 절차를 갖출 것.</text>

  <line x1="210" y1="276" x2="210" y2="318" stroke="#4a6fa5" stroke-width="2"/>
  <line x1="610" y1="276" x2="610" y2="318" stroke="#a5724a" stroke-width="2"/>

  <text x="40" y="468" font-family="sans-serif" font-size="13" fill="#666666">출처: [3] [4] [5] [6]</text>
</svg>
